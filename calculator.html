<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="calculator.css" />
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keys">
        <button type="button" class="key key-action" data-action="clear">AC</button>
        <button type="button" class="key key-action" data-action="delete">⌫</button>
        <button type="button" class="key key-action" data-action="percent">%</button>
        <button type="button" class="key key-op" data-op="÷">÷</button>

        <button type="button" class="key" data-num="7">7</button>
        <button type="button" class="key" data-num="8">8</button>
        <button type="button" class="key" data-num="9">9</button>
        <button type="button" class="key key-op" data-op="×">×</button>

        <button type="button" class="key" data-num="4">4</button>
        <button type="button" class="key" data-num="5">5</button>
        <button type="button" class="key" data-num="6">6</button>
        <button type="button" class="key key-op" data-op="−">−</button>

        <button type="button" class="key" data-num="1">1</button>
        <button type="button" class="key" data-num="2">2</button>
        <button type="button" class="key" data-num="3">3</button>
        <button type="button" class="key key-op" data-op="+">+</button>

        <button type="button" class="key key-zero" data-num="0">0</button>
        <button type="button" class="key" data-action="decimal">.</button>
        <button type="button" class="key key-equals" data-action="equals">=</button>
      </div>
    </section>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
